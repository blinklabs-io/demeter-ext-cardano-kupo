kind: ConfigMap
metadata:
  name: proxy-config
  namespace: prj-mainnet-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: proxy
  namespace: prj-mainnet-test
  labels:
    app: proxy
spec:
  selector:
    matchLabels:
      app: proxy
  template:
    metadata:
      labels:
        app: proxy
    spec:
      serviceAccountName: kube-rs
      containers:
        - name: proxy
          image: proxy:1.0
          ports:
            - containerPort: 80
          env:
            - name: NETWORK
              value: "mainnet"
            - name: PROXY_ADDR
              value: "0.0.0.0:80"
            - name: PROXY_NAMESPACE
              value: "prj-mainnet-test"
            - name: PROXY_TIERS_PATH
              value: "/kupo-proxy/tiers.toml"
            - name: PROMETHEUS_ADDR
              value: "0.0.0.0:9187"
            - name: KUPO_PORT
              value: "80"
            - name: KUPO_DNS
              value: "prj-mainnet-test.svc.cluster.local"
            - name: SSL_CRT_PATH
              value: "/kupo-proxy/localhost.crt"
            - name: SSL_KEY_PATH
              value: "/kupo-proxy/localhost.key"
          volumeMounts:
            - name: proxy-vol
              mountPath: /kupo-proxy

      volumes:
        - name: proxy-vol
          configMap:
            name: proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: proxy
  namespace: prj-mainnet-test
  labels:
    app: proxy
spec:
  selector:
    app: proxy
  type: ClusterIP
  ports:
    - name: proxy
      port: 80
      targetPort: 80
      protocol: TCP
    - name: proxy-prometheus
      port: 9187
      targetPort: 9187
      protocol: TCP
---
# Run operator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operator
  namespace: prj-mainnet-test
  labels:
    app: operator
spec:
  selector:
    matchLabels:
      app: operator
  template:
    metadata:
      labels:
        app: operator
    spec:
      serviceAccountName: kube-rs
      containers:
        - name: operator
          image: operator:1.0
          ports:
            - containerPort: 9187
          env:
            - name: ADDR
              value: "0.0.0.0:9187"
            - name: METRICS_DELAY
              value: "40"
            - name: PROMETHEUS_URL
              value: "http://prometheus/api/v1"
---
apiVersion: v1
kind: Service
metadata:
  name: operator
  namespace: prj-mainnet-test
  labels:
    app: operator
spec:
  selector:
    app: operator
  type: ClusterIP
  ports:
    - name: operator
      port: 9187
      targetPort: 9187
      protocol: TCP
